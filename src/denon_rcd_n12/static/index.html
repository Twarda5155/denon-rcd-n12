<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>denon rcd-n12</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #111;
    --dim: #777;
    --rule: #ccc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #e8e8e6; --dim: #888; --rule: #333; }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  main { width: min(34rem, 100%); padding: 2rem 1.5rem; }

  h1 {
    margin: 0 0 1.5rem;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }

  dl {
    margin: 0 0 1.5rem;
    border-top: 1px solid var(--rule);
  }

  div.row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--rule);
  }

  dt { color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; white-space: nowrap; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  dd.pending { color: var(--dim); }

  /* Track titles are the one value here of unbounded length; let them wrap
     rather than push the layout wider than the column. */
  dd#track { text-align: right; overflow-wrap: anywhere; }

  /* Two columns of controls under one shared block of readouts. Both columns
     start at the top of the grid, so the first button of each — check power
     and check source — sits on the same line. */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
    gap: 1.25rem;
  }
  .column { display: flex; flex-direction: column; }

  /* Narrow viewports get the old single column back rather than two columns
     too cramped for a button to hold its label. */
  @media (max-width: 32rem) {
    .panels { grid-template-columns: 1fr; }
  }

  .actions { display: flex; flex-direction: column; gap: 0.5rem; }
  .actions + .actions { margin-top: 1.25rem; }

  /* Three buttons that each cost one device transaction, kept on one line so
     the column does not grow taller than the readouts it belongs to. */
  .steps { display: flex; gap: 0.5rem; }
  .steps button { flex: 1; text-align: center; }

  .slider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.15rem 0.75rem 0.4rem;
  }

  input[type="range"] {
    flex: 1;
    min-width: 0;
    margin: 0;
    accent-color: var(--fg);
    cursor: pointer;
  }
  input[type="range"]:disabled { accent-color: var(--dim); cursor: default; }

  output {
    min-width: 3ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  output.pending { color: var(--dim); }

  button {
    font: inherit;
    text-align: left;
    padding: 0.55rem 0.75rem;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 0;
    cursor: pointer;
  }
  button:hover:enabled { border-color: var(--fg); }
  button:active:enabled { background: var(--fg); color: var(--bg); }
  button:disabled { color: var(--dim); cursor: default; }

  select {
    font: inherit;
    width: 100%;
    padding: 0.55rem 0.75rem;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 0;
    cursor: pointer;
  }
  select:disabled { color: var(--dim); cursor: default; }

  /* A list, not buttons: these are read from the receiver and nothing here
     can start one playing yet. */
  .favorites {
    margin: 0;
    padding: 0 0.75rem;
    list-style: none;
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .favorites li { padding: 0.15rem 0; border-bottom: 1px solid var(--rule); }
  .favorites li:last-child { border-bottom: 0; }
  .favorites li.empty { color: var(--dim); border-bottom: 0; }

  .hint {
    margin: 0;
    padding: 0 0.75rem;
    color: var(--dim);
    font-size: 12px;
  }

  #log {
    margin: 1.25rem 0 0;
    min-height: 1.5em;
    color: var(--dim);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  #log.error { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>denon rcd-n12</h1>

  <dl>
    <div class="row"><dt>power</dt><dd id="power" class="pending">&mdash;</dd></div>
    <div class="row"><dt>volume</dt><dd id="volume" class="pending">&mdash;</dd></div>
    <div class="row"><dt>source</dt><dd id="source" class="pending">&mdash;</dd></div>
    <div class="row"><dt>state</dt><dd id="state" class="pending">&mdash;</dd></div>
    <div class="row"><dt>track</dt><dd id="track" class="pending">&mdash;</dd></div>
  </dl>

  <div class="panels">
    <div class="column">
      <div class="actions">
        <button id="check-power">check power</button>
        <button id="toggle-power">toggle power</button>
      </div>

      <div class="actions">
        <button id="check-volume">check volume</button>
        <div class="slider">
          <input id="level" type="range" min="0" max="100" step="1" value="20"
                 aria-label="volume level">
          <output id="level-out" class="pending" for="level">20</output>
        </div>
        <button id="set-volume">set volume</button>
        <div class="steps">
          <button id="volume-down">vol &minus;</button>
          <button id="volume-up">vol +</button>
        </div>
        <button id="toggle-mute">toggle mute</button>
      </div>
    </div>

    <!-- Playback is a read: HEOS transport control is documented but has never
         been exercised on this unit, and a button that might do nothing is
         worse than no button. -->
    <div class="actions">
      <button id="check-playback">check playback</button>
      <button id="check-source">check source</button>
      <select id="source-pick" aria-label="source to select">
        <!-- Disabled and selected, so the list opens on a prompt rather than
             on phono: the first input is not a default anyone chose, and a
             picker that already shows a real answer invites setting it by
             accident. -->
        <option value="" selected disabled>&mdash; choose a source &mdash;</option>
        <!-- Not an input: picking this starts a stored station rather than
             switching the receiver's input, so it goes to its own route. The
             inputs are appended after it, from /api/sources. -->
        <option value="favorite:1">favorite 1</option>
      </select>
      <p class="hint">switching stops playback and wakes a sleeping unit</p>
      <button id="set-source" disabled>set source</button>
      <button id="list-favorites">list favorites</button>
      <ul id="favorites" class="favorites"></ul>
    </div>
  </div>

  <p id="log"></p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const controls = [...document.querySelectorAll("button, input, select")];
  const log = $("log");
  const slider = $("level");
  const levelOut = $("level-out");
  const picker = $("source-pick");

  // "set source" is meaningless until something is chosen, and run() re-enables
  // every control when it finishes, so the button's state has to be restored
  // from the picker rather than left to that blanket enable.
  function syncPicker() {
    $("set-source").disabled = !picker.value;
  }

  function say(text, isError) {
    log.textContent = text;
    log.classList.toggle("error", Boolean(isError));
  }

  function show(cell, text, pending) {
    cell.textContent = text;
    cell.classList.toggle("pending", Boolean(pending));
  }

  // One request at a time. Rapid back-to-back commands are reported to
  // soft-lock Denon units; the server paces them too, but this keeps the
  // page from queueing a burst in the first place.
  async function run(label, path, options) {
    controls.forEach((c) => (c.disabled = true));
    say(label + "…");
    try {
      const res = await fetch(path, options);
      // Read as text first: an HTTP-level error page is HTML, and letting
      // res.json() choke on it would report a parser error rather than the
      // status that actually explains what went wrong.
      const body = await res.text();
      let data;
      try {
        data = JSON.parse(body);
      } catch {
        throw new Error("http " + res.status + ": server sent a non-JSON reply");
      }
      if (!data.ok) throw new Error(data.error || "request failed");
      if ("power" in data) show($("power"), data.power, false);
      if ("volume" in data) {
        show($("volume"), data.volume + "/100" + (data.mute ? "  muted" : ""), false);
        // Track what the device settled on, which may not be what was asked
        // for: the slider is a request, the readout is the answer.
        slider.value = data.volume;
        show(levelOut, String(data.volume), false);
      }
      if ("source" in data) {
        show($("source"), data.source, false);
        // The picker is a request and the row is the answer, as with the
        // volume slider. "server" is a state the unit reports but nobody can
        // select — it is the network input with a LAN server playing on it —
        // so when that comes back, leave the picker alone and let the row say
        // it.
        if ([...picker.options].some((o) => o.value === data.source)) {
          picker.value = data.source;
        }
      }
      if ("favorites" in data) {
        const list = $("favorites");
        list.textContent = "";
        for (const fav of data.favorites) {
          const li = document.createElement("li");
          // textContent, never innerHTML: these names come off the receiver
          // and out of a streaming directory, and are not ours to trust.
          li.textContent = fav.name || fav.mid || "(unnamed)";
          list.append(li);
        }
        if (!data.favorites.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "none stored on the receiver";
          list.append(li);
        }
      }
      if ("state" in data) {
        show($("state"), data.state, false);
        const parts = [data.title, data.artist];
        // The station repeats the artist on a TuneIn stream and repeats the
        // title on a CD, where the unit fills both fields with the track. Show
        // it only when it says something the other two do not.
        if (data.station && data.station !== data.artist && data.station !== data.title) {
          parts.push(data.station);
        }
        const track = parts.filter(Boolean).join("  ·  ");
        // Dim a title the transport is not actually playing. The unit keeps
        // reporting the last track it loaded — through a stop, and through
        // standby — so an undimmed title next to "stop" would be a lie. The
        // test is for the two states that mean sound rather than against
        // "stop": the unit also reports "unknown" while a change settles, and
        // the title is no more current then than it is at a stop.
        const playing = data.state === "play" || data.state === "pause";
        show($("track"), track || "—", !track || !playing);
      }
      say(label + " ok");
    } catch (err) {
      say(err.message, true);
    } finally {
      controls.forEach((c) => (c.disabled = false));
      syncPicker();
    }
  }

  const form = { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" } };

  $("check-power").onclick = () => run("check power", "/api/power");
  $("check-volume").onclick = () => run("check volume", "/api/volume");
  $("check-source").onclick = () => run("check source", "/api/source");
  $("check-playback").onclick = () => run("check playback", "/api/playback");
  $("list-favorites").onclick = () => run("list favorites", "/api/favorites");
  $("set-source").onclick = async () => {
    // Two different things share one picker: an input is selected over the AVR
    // protocol, a favourite is started over HEOS. The value says which.
    const favorite = picker.value.startsWith("favorite:");
    if (favorite) {
      await run("play favorite", "/api/favorites", {
        ...form,
        body: "preset=" + encodeURIComponent(picker.value.slice("favorite:".length)),
      });
      // Starting a favourite can move the input to the network one, and the
      // reply says nothing about that.
      show($("source"), $("source").textContent, true);
    } else {
      await run("set source", "/api/source", {
        ...form,
        body: "name=" + encodeURIComponent(picker.value),
      });
    }
    // An input write wakes a sleeping unit — measured 2026-09-08, standby to
    // on with no echo and no PWON sent. Whether starting a favourite does the
    // same is unmeasured, so the row is dimmed either way: "this was true a
    // moment ago" beats a value we cannot vouch for, and costs no paced
    // device transaction the way re-reading would.
    show($("power"), $("power").textContent, true);
  };
  $("toggle-power").onclick = () =>
    run("toggle power", "/api/power", { ...form, body: "state=toggle" });
  $("set-volume").onclick = () =>
    run("set volume", "/api/volume", { ...form, body: "level=" + slider.value });
  // Relative: the unit applies the step to whatever it currently holds, so
  // these need no read first and cannot fight a level set at the front panel.
  $("volume-up").onclick = () =>
    run("volume up", "/api/volume/step", { ...form, body: "direction=up&step=1" });
  $("volume-down").onclick = () =>
    run("volume down", "/api/volume/step", { ...form, body: "direction=down&step=1" });
  $("toggle-mute").onclick = () =>
    run("toggle mute", "/api/mute", { ...form, body: "state=toggle" });

  // Dim while the slider holds a level the device has not confirmed; solid
  // again once a reply comes back through run().
  slider.oninput = () => show(levelOut, slider.value, true);

  picker.onchange = syncPicker;

  // Fill the picker from the server rather than hardcoding the input names
  // here: the mapping lives in client.py, where it was measured, and a second
  // copy in the page would be free to drift from it. This is the one request
  // the page makes on its own, and it reaches no further than the local
  // process — the list is a constant, not a device read.
  (async () => {
    try {
      const res = await fetch("/api/sources");
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "request failed");
      for (const name of data.sources) picker.add(new Option(name, name));
    } catch (err) {
      say("could not load the input list: " + err.message, true);
    }
  })();
</script>
</body>
</html>
